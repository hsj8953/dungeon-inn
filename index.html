<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f1726">
<meta name="description" content="던전 앞 허름한 여관을 키우는 방치형 도트 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="던전 앞 여관">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>던전 앞 여관</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  /* Layout: one-screen phone game — HUD bar, pixel stage (inn / forge / market scenes), six tabs, scrolling ledger */
  --bg:#1f1726;
  --panel:#2b2032;
  --panel2:#36293e;
  --line:#4b3a54;
  --text:#f1e4cc;
  --muted:#b5a38d;
  --gold:#f2b541;
  --gold-ink:#3a2410;
  --good:#7cc47a;
  --bad:#e3826f;
  --love:#ff8aa8;
  --wood:#8a5a3b;
  --wood-dark:#4a2e1e;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 6px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
.app{max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.hud{flex:none;display:flex;align-items:center;gap:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px 5px 10px}
.gold{font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-width:0}
.gpill{flex:none;display:inline-flex;align-items:center;gap:5px;background:rgba(20,12,22,.82);border:1px solid rgba(242,181,65,.4);border-radius:999px;padding:0 9px 0 7px;font-family:var(--display);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.35;align-self:flex-start}
.gpill.neg{color:var(--bad)}
.rate{font-family:var(--body);font-size:11px;color:var(--good);white-space:nowrap}
.goal{flex:none;max-width:50%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px 3px;font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal:empty{display:none}
.goal b{font-weight:400;color:var(--text)}
.goal .gb{height:3px;background:#4a3a54;border-radius:2px;margin-top:2px;overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--gold)}
.coin{width:13px;height:13px;background:var(--gold);box-shadow:inset -3px -3px 0 #c98a1f;border-radius:2px;flex:none}
.mats{display:flex;gap:8px;margin-right:auto;flex-wrap:wrap}
.mat{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mat i{width:8px;height:8px;display:inline-block;border-radius:1px}
.mat b{color:var(--text);font-weight:400;font-family:var(--display);font-size:14px}
.sndBtn{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid rgba(242,181,65,.5);background:rgba(20,12,22,.82);color:var(--gold);font-size:14px;line-height:1;cursor:pointer;padding:0}
.sndBtn.off{color:var(--muted);border-color:var(--line);text-decoration:line-through}
.rushBtn{font-family:var(--display);font-size:12px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:3px 10px;cursor:pointer;line-height:1.2;box-shadow:0 2px 0 #b07a1c;flex:none}
.rushBtn small{font-size:10px;opacity:.7;margin-left:3px}
.rushBtn:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}

.stage{flex:none;position:relative;background:linear-gradient(90deg,#2a1c22,#3a2630 8%,#3a2630 92%,#2a1c22);overflow:hidden;container-type:inline-size;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));border-bottom:3px solid var(--wood-dark)}
@media (min-width:500px){.stage{margin-left:0;margin-right:0;border:3px solid var(--wood-dark);border-radius:0 0 10px 10px}}
#inn{display:block;width:100%;height:auto;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.ohud{position:absolute;top:0;left:0;right:0;padding:4px max(8px,env(safe-area-inset-right,0px)) 14px max(8px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;background:linear-gradient(rgba(14,9,18,.85),rgba(14,9,18,.55) 60%,rgba(14,9,18,0));pointer-events:none}
.ohud button{pointer-events:auto}
.chip{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:400;color:var(--text);font-family:var(--display);font-size:13px}
.chip .rush{color:var(--gold)}
.infobar{flex:none;display:flex;gap:8px;align-items:center;min-height:24px;margin-top:-1px}
.ticker{flex:1;min-width:0;color:var(--text);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.tag{display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.tag span{background:rgba(20,12,22,.8);font-size:11px;padding:0 6px;border-radius:4px;color:var(--muted)}
.tag span b{font-family:var(--display);font-weight:400;color:var(--text)}
.tag .rush{background:var(--gold);color:var(--gold-ink);font-family:var(--display)}
.toast,.hit{position:absolute;left:50%;transform:translate(-50%,0);font-family:var(--display);white-space:nowrap;pointer-events:none;opacity:0}
.toast{top:40px;background:var(--gold);color:var(--gold-ink);font-size:17px;padding:5px 14px;border-radius:8px;box-shadow:0 3px 0 #b07a1c,0 0 0 2px #3a2410}
.toast.on{animation:pop 2s ease-out forwards}
.hit{top:42%;font-size:26px;color:#fff6d0;text-shadow:0 2px 0 #3a2410,0 0 6px #000}
.hit.on{animation:pop 0.8s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-14px)}}

.tabs{flex:none;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--wood-dark);padding:4px;border-radius:10px}
.tabs button{font-family:var(--display);font-size:13px;background:transparent;color:#d8c2a0;border:0;border-radius:5px;padding:6px 0;cursor:pointer;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--wood);color:#fff6e4}
.tabs .dot{position:absolute;top:2px;right:3px;min-width:7px;height:7px;border-radius:7px;background:var(--gold)}
.tabs .cnt{position:absolute;top:0;right:1px;min-width:15px;height:15px;border-radius:8px;background:#e85a5a;color:#fff;font-family:var(--body);font-size:10px;line-height:15px;padding:0 3px;box-sizing:border-box;font-style:normal}

.panel{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px;overscroll-behavior:contain}
.tile .cnt{font-family:var(--display);font-size:15px;color:var(--text)}
.wallet{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:24px;color:var(--gold)}
.wallet .coin{width:16px;height:16px}
.hint{font-size:13px;color:var(--muted);margin:0 2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .info{flex:1;min-width:150px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px}
.card h3 small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:4px}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card p em{font-style:normal;color:var(--text)}
.next{color:var(--gold)}
.up{color:var(--good)}.down{color:var(--bad)}
.card p em.down{color:var(--bad)}.card p em.up{color:var(--good)}
.card.locked{opacity:.55}
.card.sel{border-color:var(--gold)}
.card.hot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pips{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap}
.pips i{width:8px;height:5px;border-radius:1px;background:var(--panel2)}
.pips i.on{background:var(--gold)}
.row{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.btn{font-family:var(--display);font-size:14px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:6px;padding:7px 10px;min-width:70px;cursor:pointer;line-height:1.25;box-shadow:0 2px 0 #b07a1c;white-space:nowrap}
.btn small{display:block;font-size:11px;opacity:.8}
.btn.sm{min-width:0;padding:5px 9px;font-size:13px}
.btn.big{width:100%;font-size:22px;padding:14px 10px;touch-action:none;-webkit-user-select:none;user-select:none}
.btn:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.alt{background:#7cc47a;box-shadow:0 2px 0 #4a8a48;color:#16301a}
.btn.warn{background:#e3826f;box-shadow:0 2px 0 #a0503e;color:#2a100a}
.btn.love{background:var(--love);box-shadow:0 2px 0 #c0587a;color:#3a1020}
.btn:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sprite{width:30px;height:42px;image-rendering:pixelated;flex:none;object-fit:contain}
.icon{width:30px;height:30px;image-rendering:pixelated;flex:none;background:var(--panel2);border-radius:6px;padding:2px;box-sizing:border-box;object-fit:contain}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--good);width:0%}
.bar.warnbar i{background:var(--bad)}
.badge{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;margin-left:4px;vertical-align:1px;font-family:var(--body)}
.hearts{color:var(--love);letter-spacing:1px;font-size:12px}
.hearts .off{color:#5a4a5e}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#5a4a5e}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:var(--display);font-size:14px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chips button:disabled{opacity:.4;cursor:default}
.sec{font-family:var(--display);font-size:14px;color:var(--muted);margin:4px 2px 0;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec span{font-family:var(--body);font-size:12px;letter-spacing:0}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;flex:none}
.spark i{width:4px;background:#6a5a74;border-radius:1px}
.spark i:last-child{background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:11px;color:var(--muted);line-height:1.25;min-width:0}
.tile img{width:34px;height:34px;image-rendering:pixelated;object-fit:contain}
.tile b{font-weight:400;color:var(--text);font-size:12px;word-break:keep-all}
.tile.unk img{filter:brightness(0);opacity:.35}
.tile.unk b{color:var(--muted)}
.tile button{all:unset;cursor:pointer;display:contents}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;flex:1;min-width:80px;align-self:center}
.progress i{display:block;height:100%;background:var(--gold)}
.story{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.story button{font-family:var(--body);font-size:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:1px 7px;cursor:pointer}
.story button:disabled{opacity:.35;cursor:default}
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.logbox div:first-child{color:var(--text)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.foot button{font-family:var(--body);font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 8px;cursor:pointer;flex:none}
.foot button.warn{border-color:var(--bad);color:var(--bad)}
.modal[hidden]{display:none}
.promo[hidden]{display:none}
.promo{position:fixed;inset:0;z-index:18;background:radial-gradient(circle at 50% 30%,rgba(60,40,20,.92),rgba(10,6,14,.96));display:flex;align-items:center;justify-content:center;padding:14px}
.pr{position:relative;width:100%;max-width:400px;max-height:92vh;overflow:auto;background:linear-gradient(#2e2230,#1c1420);border:3px solid #c89a3a;border-radius:16px;box-shadow:0 0 0 3px #3a2410,0 0 40px rgba(242,181,65,.25);padding:14px;display:flex;flex-direction:column;gap:10px}
.pr-x{position:absolute;top:6px;right:10px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
.pr-x[hidden]{display:none}
.pr-top{text-align:center}
.pr-ttl{font-family:var(--display);font-size:13px;letter-spacing:4px;color:#c89a3a}
.pr-rank{font-family:var(--display);font-size:26px;display:flex;justify-content:center;align-items:center;gap:10px;text-shadow:0 2px 0 #1a0e08}
.pr-rank i{font-style:normal;font-size:16px;color:var(--gold);animation:pulse 1s infinite}
.pr-who{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:4px}
.pr-who img{width:30px;height:42px;image-rendering:pixelated}
.pr-who b{display:block;font-family:var(--display);font-weight:400;font-size:17px;text-align:left}
.pr-who span{font-size:12px;color:var(--muted)}
.pr-sec{font-family:var(--display);font-size:13px;color:var(--muted)}
.pr-list{display:flex;flex-direction:column;gap:4px}
.pr-list div{display:flex;align-items:center;gap:8px;background:#160e16;border:1px solid #3a2c42;border-radius:8px;padding:5px 9px;font-size:13px}
.pr-list i{font-style:normal;width:16px;text-align:center}
.pr-list img{width:18px;height:18px;image-rendering:pixelated}
.pr-list span{flex:1}
.pr-list .coin{flex:none}
.pr-list b{font-family:var(--display);font-weight:400}
.pr-list .ok i,.pr-list .ok b{color:var(--good)}.pr-list .no i,.pr-list .no b{color:var(--bad)}
.pr-rule,.pr-src{background:#24182a;border:1px solid #4a3a54;border-radius:10px;padding:8px 10px;font-size:12px;color:#d8c8b8;line-height:1.5}
.pr-rule b,.pr-src b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:var(--gold)}
.pr-src{font-size:11px;color:var(--muted)}.pr-src b{font-size:13px;color:var(--text)}
.pr-play{display:flex;flex-direction:column;gap:10px;min-height:280px}
.pr-cd{font-family:var(--display);font-size:80px;text-align:center;color:var(--gold);text-shadow:0 4px 0 #5a3a10;animation:pulse 1s infinite}
.pr-hint,.pr-msg{text-align:center;font-size:13px;color:var(--muted)}
.pr-msg{font-family:var(--display);font-size:16px;color:var(--text);min-height:22px}
.pr-stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pr-stat b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--text)}
.pr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr-grid button{aspect-ratio:1;border-radius:12px;border:2px solid #4a3a2a;background:radial-gradient(circle at 50% 70%,#5a4a2a,#2a2014);cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.pr-grid button img{width:64px;height:68px;image-rendering:pixelated;animation:pop .15s ease-out}
.pr-grid button.on{border-color:var(--gold);box-shadow:0 0 12px rgba(242,181,65,.4)}
.pr-grid button.hit{background:radial-gradient(circle,#fff3b0,#e8a030);border-color:#fff}
@keyframes pop{from{transform:scale(.3) translateY(30%)}to{transform:none}}
.pr-lane{position:relative;height:110px;background:linear-gradient(90deg,#3a1a1a,#241a24 30%,#241a24 70%,#3a1a1a);border:2px solid #1a0e12;border-radius:12px;overflow:hidden}
.pr-lane .zone{position:absolute;top:0;bottom:0;width:15%;background:rgba(242,181,65,.22);border-left:2px dashed #f2b541;border-right:2px dashed #f2b541}
.pr-lane .zone.l{left:29%}.pr-lane .zone.r{right:29%}
.pr-lane .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.pr-lane .core img{width:34px;height:48px;image-rendering:pixelated}
#prAtk{position:absolute;top:50%;width:36px;height:36px;image-rendering:pixelated;display:none}
.pr-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr-btns button{font-family:var(--display);font-size:22px;padding:18px 0;border-radius:12px;border:0;background:linear-gradient(#8ab0e8,#4a6ab0);color:#0a1428;box-shadow:0 3px 0 #2a3a6a;cursor:pointer;touch-action:manipulation}
.pr-runes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr-runes button{aspect-ratio:1.6;border-radius:14px;border:3px solid var(--rc);background:#1a1018;color:var(--rc);font-family:var(--display);font-size:26px;cursor:pointer;touch-action:manipulation;transition:background .1s}
.pr-runes button.lit,.pr-runes button:active:not(:disabled){background:var(--rc);color:#fff;box-shadow:0 0 22px var(--rc)}
.pr-runes button:disabled{opacity:1}
.pr-res{text-align:center;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.pr-res p{font-size:14px;color:var(--muted);margin:0 0 6px}
/* ---- boss ---- */
.bhud[hidden]{display:none}
.bhud{position:absolute;inset:40px 0 0 0;pointer-events:none;z-index:3}
.bplate{position:absolute;top:2px;left:8px;right:8px;display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(30,14,22,.92),rgba(20,10,16,.88));border:2px solid #8a3a3a;border-radius:10px;padding:5px 9px;box-shadow:0 0 0 2px #1a0808,0 4px 12px rgba(0,0,0,.5)}
.bplate img{width:34px;height:36px;image-rendering:pixelated;background:#140a10;border:1px solid #5a2a2a;border-radius:6px}
.bp-t{flex:1;min-width:0}
.bp-n{display:flex;align-items:baseline;gap:6px}
.bp-n b{font-family:var(--display);font-weight:400;font-size:16px;color:#ffd8c8}
.bp-n span{font-size:10px;color:#c8a0a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enr{font-style:normal;font-family:var(--display);font-size:11px;background:#e3504a;color:#fff;border-radius:4px;padding:0 5px;animation:blink .5s infinite;margin-left:auto}
.bhp{position:relative;height:13px;margin-top:3px;background:#2a0e12;border:1px solid #000;border-radius:3px;overflow:hidden}
.bhp i{position:absolute;left:0;top:0;bottom:0}
.bhp .chip{background:#f0d0a0}
.bhp .cur{background:linear-gradient(#ff6a5a,#c8282a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bhp span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;color:#fff;text-shadow:0 1px 0 #000}
.pframes{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;justify-content:center}
.pf{flex:1;max-width:84px;display:flex;gap:3px;align-items:center;background:rgba(16,10,20,.86);border:1px solid #5a4a6a;border-radius:7px;padding:2px 4px 3px 2px}
.pf img{width:18px;height:26px;image-rendering:pixelated}

.bfx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bnum{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:17px;color:#fff;text-shadow:0 2px 0 #1a0a0a,0 0 4px #000;animation:bn 1.05s ease-out forwards;white-space:nowrap}

.bnum.dmg{color:#ff8a7a;font-size:15px}.bnum.dmgc{color:#ff4a3a;font-size:21px}
.bnum.heal{color:#9ae89a;font-size:15px}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.bban{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none;z-index:5;opacity:0}

.bban span{font-size:12px;color:#ffd0c0;text-shadow:0 1px 0 #000}
.bban.on{animation:bb 1.4s ease-out}
@keyframes bb{0%{opacity:0;transform:scaleX(1.6)}15%{opacity:1;transform:scaleX(1)}75%{opacity:1}100%{opacity:0}}
.bres{position:absolute;left:12px;right:12px;top:22%;pointer-events:auto;text-align:center;background:linear-gradient(rgba(30,18,26,.96),rgba(18,10,16,.96));border:2px solid #c89a3a;border-radius:14px;padding:12px 14px;box-shadow:0 0 0 2px #2a1810,0 10px 30px rgba(0,0,0,.6);animation:pg .4s ease}

.br-b{font-family:var(--display);font-size:34px;letter-spacing:4px;color:#ffe070;text-shadow:0 3px 0 #6a3a10,0 0 14px rgba(255,200,80,.6)}

.bres h3{margin:2px 0 4px;font-family:var(--display);font-weight:400;font-size:18px}

.btime{font-style:normal;font-family:var(--display);font-size:12px;color:#ffe0c0;background:#3a1a1a;border:1px solid #6a3a3a;border-radius:5px;padding:0 6px;margin-left:auto;white-space:nowrap}
.enr+.btime{margin-left:4px}

.btime.fin{color:#fff;background:linear-gradient(90deg,#8a1a2a,#e3504a);border-color:#ff8a7a}
.bwarn{background:#2a0e12;border:2px solid #8a2a2a;border-radius:10px;padding:8px 10px;font-size:12px;color:#e8c8c0;line-height:1.5}
.bwarn b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:#ff9a8a}
.bwarn em{font-style:normal;color:#ff9a8a}
.bctl{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);color:var(--muted)}
.bsheet{background:linear-gradient(#2e1a22,#20141a);border:2px solid #8a3a3a;border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:9px;box-shadow:inset 0 1px 0 rgba(255,200,180,.08)}
.bs-h{display:flex;gap:12px;align-items:center}
.bs-p{flex:none;width:70px;height:70px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,#6a2a3a,#1a0c12 70%);border:2px solid #8a3a3a}

.bs-ti{font-size:11px;color:#c8a0a0}
.bs-h h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:#ffd8c8}
.bs-rec{font-size:12px;color:var(--muted)}.bs-rec b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold)}
.bstats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}

.bstats b{font-family:var(--display);font-weight:400;font-size:15px}
.bskills{display:flex;flex-direction:column;gap:4px}
.bskills div{display:grid;grid-template-columns:38px auto 1fr;gap:6px;align-items:center;font-size:12px}

.bskills b{font-family:var(--display);font-weight:400;color:#ffd8c8}
.bskills span{color:var(--muted);font-size:11px}
.psel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ps{display:flex;gap:6px;align-items:center;background:#221a28;border:2px solid #3e2f48;border-radius:10px;padding:5px 6px;cursor:pointer;position:relative}
.ps img{width:24px;height:34px;image-rendering:pixelated}
.ps-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.ps-t b{font-family:var(--display);font-weight:400;font-size:14px}
.ps-t span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-t em{font-style:normal;color:var(--text)}
.ps .ck{width:18px;height:18px;border-radius:50%;border:2px solid #4b3a54;display:grid;place-items:center;font-size:11px;color:#1a1008}

.bsum{background:#1a1220;border:1px solid #4b3a54;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.bsum-r{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.bsum-r b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--text)}
.pbar{position:relative;height:8px;background:#2a1e30;border-radius:4px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
/* ---- forge panel ---- */
.mkh{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3a2a1e,#2a1e26);border:2px solid #6a4a2a;border-radius:12px;padding:10px 12px}
.mkh>div:first-child{flex:1;min-width:0}
.mkn{font-family:var(--display);font-size:20px;color:var(--gold);line-height:1.2}
.mkd{font-size:12px;color:var(--muted);line-height:1.35}
.mkt{flex:none;text-align:center;background:#1a1218;border:1px solid #4a3a2a;border-radius:8px;padding:4px 8px;font-size:10px;color:var(--muted);display:flex;flex-direction:column}
.mkt b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--text)}
.mr{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:'i n s p' 'b b b b';gap:6px 10px;align-items:center;background:linear-gradient(#2e2236,#261c2c);border:1px solid #4b3a54;border-radius:12px;padding:9px 10px}
.mr .ifr{grid-area:i}.mr .mi{grid-area:n}.mr .mspark{grid-area:s}.mr .mp{grid-area:p}.mr .mbtns{grid-area:b}
.mi{min-width:0;display:flex;flex-direction:column}
.mi b{font-family:var(--display);font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi span{font-size:11px;color:var(--muted)}.mi em{font-style:normal;color:var(--text)}
.mspark{display:flex;align-items:flex-end;gap:2px;height:28px}
.mspark i{display:block;width:4px;border-radius:1px}
.mp{text-align:right;display:flex;flex-direction:column;line-height:1.2}
.mp b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--gold)}
.mp span{font-size:11px;color:var(--muted)}.mp .up{color:var(--good)}.mp .down{color:var(--bad)}
.mbtns{display:flex;gap:6px;flex-wrap:wrap}
.of{background:linear-gradient(#3a2a26,#2a1e22);border:2px solid #8a6a3a;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
.of-h{display:flex;align-items:center;gap:8px;position:relative}
.of-h .por{width:30px;height:42px;image-rendering:pixelated}
.of-h .bub{position:absolute;left:18px;top:-6px;background:#fff;border-radius:6px;padding:1px;box-shadow:0 1px 0 #2a1810}
.of-h .bub img{width:18px;height:18px;image-rendering:pixelated;display:block}
.of-h .mi{flex:1}
.of-c{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.of-c b{font-family:var(--display);font-weight:400;color:var(--text);font-size:14px}
.of-b{display:flex;gap:5px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#1a1220;border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{font-family:var(--display);font-size:15px;background:transparent;color:var(--muted);border:0;border-radius:7px;padding:7px 4px;cursor:pointer;position:relative}
.seg button[aria-pressed="true"]{background:linear-gradient(#4a3550,#3a2a42);color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #6a4a5a}
.seg .n{display:inline-block;min-width:16px;font-size:11px;background:var(--bad);color:#2a100a;border-radius:8px;padding:0 4px;margin-left:4px;vertical-align:2px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rt{position:relative;background:linear-gradient(#2f2337,#271d2e);border:2px solid #3e2f48;border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:var(--display);color:var(--text);font-size:14px}
.rt img{width:42px;height:42px;image-rendering:pixelated}
.rt .st{font-size:10px;color:var(--gold);letter-spacing:-1px}
.rt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(242,181,65,.25)}
.rt.no{opacity:.55}
.rt .ok{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good)}
.fd{background:linear-gradient(#30233a,#241a2b);border:2px solid #4b3a54;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fd-h{display:flex;gap:12px;align-items:center}
.ifr{flex:none;width:64px;height:64px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle,var(--glow,#5a4a3a) 0%,#1a1220 72%);border:2px solid var(--glow,#5a4a3a)}
.ifr img{width:48px;height:48px;image-rendering:pixelated}
.ifr.sm{width:46px;height:46px;border-radius:8px}.ifr.sm img{width:34px;height:34px}
.fd-h h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2}
.fd-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#1c1422;border:1px solid #3a2c42;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--text)}
.mrow{display:flex;flex-wrap:wrap;gap:6px}
.mc{display:inline-flex;align-items:center;gap:5px;background:#1c1422;border:1px solid #3a2c42;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.mc img{width:22px;height:22px;image-rendering:pixelated}
.mc b{font-family:var(--display);font-weight:400}
.mc.lack{border-color:#7a3a3a;background:#2a1418}.mc.lack b{color:var(--bad)}
.mc.gold .coin{margin-left:4px}
.cpick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cpick button{background:#1c1422;border:1px solid #3a2c42;border-radius:8px;padding:5px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--body);font-size:11px;color:var(--muted);cursor:pointer}
.cpick button img{width:28px;height:28px;image-rendering:pixelated}
.cpick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:#2e2218}
.go{width:100%;font-family:var(--display);font-size:20px;border:0;border-radius:10px;padding:12px;cursor:pointer;color:var(--gold-ink);background:linear-gradient(#ffcf5a,#e8a030);box-shadow:0 3px 0 #9a6a1a,inset 0 1px 0 #fff3b0}
.go small{display:block;font-family:var(--body);font-size:12px;opacity:.75}
.go:disabled{background:#3a2c42;color:var(--muted);box-shadow:none;cursor:default}
.go.red{background:linear-gradient(#ff9a7a,#d8583e);box-shadow:0 3px 0 #8a2e1e,inset 0 1px 0 #ffd0c0;color:#2a0e08}
.fnote{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.rq{background:linear-gradient(#30233a,#241a2b);border:2px solid #4b3a54;border-radius:12px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.rq h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px}
.rq .who{font-size:12px;color:var(--muted)}
.dbar{height:7px;background:#1a1220;border-radius:4px;overflow:hidden;border:1px solid #3a2c42}
.dbar i{display:block;height:100%;background:linear-gradient(90deg,#e3826f,#f2b541)}
.rq .acts{grid-column:1/-1;display:flex;gap:6px}
.rq .acts .go{flex:1;font-size:16px;padding:9px}
.rq .acts .btn{flex:none}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:11px;border-radius:6px;padding:1px 7px;background:#1c1422;border:1px solid #3a2c42;color:var(--muted)}
.tg.up{color:var(--good);border-color:#3a5a3a}.tg.dn{color:var(--bad);border-color:#6a3a3a}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.it{background:#221a28;border:2px solid var(--gc,#3e2f48);border-radius:10px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:11px;color:var(--muted)}
.it img{width:36px;height:36px;image-rendering:pixelated}
.it b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--text)}
.it.sel{box-shadow:0 0 0 2px var(--gold)}
.eqr{display:flex;align-items:center;gap:8px;background:#1c1422;border:1px solid #3a2c42;border-radius:8px;padding:5px 8px}
.eqr img{width:24px;height:34px;image-rendering:pixelated}
.eqr .nm{flex:1;min-width:0;font-size:13px}
.eqr .nm small{display:block;color:var(--muted);font-size:11px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px;border:1px dashed #4b3a54;border-radius:12px}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--text);margin-bottom:2px}
/* ---- forge minigame overlay ---- */
.mgx[hidden]{display:none}
.mgx{position:absolute;left:0;right:0;top:44px;display:flex;justify-content:center;padding:0 10px;pointer-events:auto;z-index:3}
.mgc{width:100%;max-width:380px;background:linear-gradient(rgba(34,22,36,.94),rgba(24,16,26,.94));border:2px solid #8a6a3a;border-radius:12px;box-shadow:0 0 0 2px #2a1810,0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,230,160,.15);padding:9px 11px;color:var(--text);position:relative}
.mgc-h{display:flex;align-items:center;gap:9px}
.mgc-h img{width:34px;height:34px;image-rendering:pixelated;background:#1a1018;border:1px solid #5a4030;border-radius:6px}
.mgc-h .t{flex:1;min-width:0}
.mgc-h .t b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgc-h .t span{font-size:11px;color:var(--muted)}
.mgc-h .st{font-size:11px;color:var(--gold);letter-spacing:-1px}
.step{font-family:var(--display);font-size:13px;color:var(--muted);text-align:right;line-height:1.1}
.step b{font-size:22px;color:var(--gold);font-weight:400}
.gauge{position:relative;height:26px;margin:10px 2px 6px;background:linear-gradient(#2a1c22,#3a2830);border:2px solid #1a0e12;border-radius:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);overflow:visible}
.gz{position:absolute;top:0;bottom:0}
.gz.k{background:rgba(160,100,60,.55)}.gz.g{background:rgba(232,160,48,.8)}.gz.p{background:linear-gradient(#fff3b0,#ffcf3a);box-shadow:0 0 10px #ffcf3a}
.gcur{position:absolute;top:-7px;bottom:-7px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #1a0e12,0 0 8px #fff}
.gcur::before{content:'';position:absolute;left:-4px;top:-5px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.hits{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hs{text-align:center;font-family:var(--display);font-size:13px;border-radius:7px;padding:3px 0;background:#1a1218;border:1px solid #3a2c42;color:#5a4a5e}
.hs.s0{color:#a89a9a;border-color:#5a4a4a}.hs.s1{color:#e0b070;border-color:#8a6a3a}.hs.s2{color:#9ae89a;border-color:#3a7a3a}.hs.s3{color:#2a1a08;background:linear-gradient(#fff3b0,#ffcf3a);border-color:#ffcf3a}
.hs.now{border-color:var(--gold);color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 8px rgba(242,181,65,.6)}}
.mgf{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.mgf b{font-family:var(--display);font-weight:400;font-size:13px}
.judge{position:absolute;left:50%;top:72%;z-index:4;transform:translate(-50%,-50%);font-family:var(--display);font-size:30px;pointer-events:none;opacity:0;white-space:nowrap;text-shadow:0 3px 0 #2a1408,0 0 10px rgba(0,0,0,.8)}
.judge.on{animation:jg .7s ease-out}
@keyframes jg{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.hg{position:relative;height:40px;margin:12px 2px 4px;background:linear-gradient(90deg,#2a3a5a,#3a2a3a 40%,#4a2a22 80%,#6a1a12);border:2px solid #1a0e12;border-radius:8px;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.hg-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(232,89,44,.35),rgba(255,207,58,.55));border-radius:6px 0 0 6px}
.hg-fill.hot{background:linear-gradient(90deg,rgba(232,89,44,.4),rgba(255,74,58,.75))}
.hg-band{position:absolute;top:-4px;bottom:-4px;background:rgba(124,220,122,.28);border:3px solid #7cdc7a;border-radius:6px;box-shadow:0 0 10px rgba(124,220,122,.5);display:grid;place-items:center}
.hg-band span{font-family:var(--display);font-size:13px;color:#d8ffd0;text-shadow:0 1px 0 #1a3a1a}
.hg-band.in{background:rgba(124,220,122,.55);box-shadow:0 0 18px rgba(124,220,122,.9)}
.hg-cur{position:absolute;top:-9px;bottom:-9px;width:5px;margin-left:-2px;background:#fff;border-radius:3px;box-shadow:0 0 0 1px #1a0e12,0 0 8px #fff}
.hg-hot{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:10px;color:#ff9a8a}
.rp2{display:grid;grid-template-columns:1fr 72px;gap:10px;align-items:center;margin-top:4px}
.rp2 .info{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.rp2 .info b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--text)}
.ckbig{text-align:center;font-family:var(--display);font-size:34px;line-height:1;margin:6px 0 2px}

const STREAM={bed:['room',1],walls:['room',.8],decor:['room',.6],kitchen:['meal',1],dining:['meal',.7],bar:['meal',.7],light:['all',.5],ext:['all',.5]};

const MS_EVERY=10,MS_MULT=1.5;
function streamSum(s,o){const l=o||S.lv;let n=0;for(const k in STREAM)if(STREAM[k][0]===s)n+=l[k]||0;return n;}
function streamMult(s,o){const l=o||S.lv;let add=1;for(const k in STREAM)if(STREAM[k][0]===s)add+=.5*STREAM[k][1]*(l[k]||0);return add*Math.pow(MS_MULT,Math.floor(streamSum(s,l)/MS_EVERY));}
function lvWith(k,l){const o=Object.assign({},S.lv);o[k]=l;return o;}
function roomAt(o){return 5*streamMult('room',o)*REG().price;}
function mealAt(o){return 3*streamMult('meal',o)*REG().price;}
function dinerCap(d=S.lv.dining){return Math.min(4,1+Math.floor(d/4))+2*nxOf(S.lv.wing||0,S.lv.build);}
function dinerInt(sg=S.lv.sign,b=S.lv.bar){return Math.max(1.2,3.5-.18*sg-.06*b);}
const STAFF_AUTO=[0,.25,.35,.45,.55,.65,.8],STAFF_N=[0,1,1,2,2,3,3];
const CATS=['객실','식당','외관','운영'];
const CAP=[1,2,2,2,2,2,3,3,3,4,5,6];
const ORDER=[1,0,2,4,3,5];
function buildShape(b){return b<5?'A':b<9?'B':'C';}
function capOf(u){if(u.key==='build'||u.key==='wing'||u.key==='staff')return u.max;return Math.max(1,Math.round(u.max*CAPF[S.region||0]));}
function gateStart(u){return Math.min(capOf(u),(REG().start||{})[u.key]||u.min||0);}
function gateAt(u,d){const cap=capOf(u),st=gateStart(u),N=FLOORS.length;return Math.min(cap,st+Math.ceil((cap-st)*Math.min(1,(d+2)/(N+1))));}
function gateOf(u){if(u.key==='staff'||u.keep||S.bossBeaten)return capOf(u);return gateAt(u,deepest());}
function gateFloor(u,l){const N=FLOORS.length;for(let d=deepest()+1;d<N;d++)if(gateAt(u,d)>l)return d+1;return 0;}
function upgCost(u,l){
  if(l>=capOf(u))return null;
  const gold=Math.round((u.costs?u.costs[l]:u.base*Math.pow(u.grow,l))*REG().price);
  if(l>=gateOf(u)){const f=gateFloor(u,l);return {gold,lock:f?`던전 ${f}층 개방 필요`:'보스 토벌 후'};}
  if(u.req&&u.req[l+1]&&S.lv.build<u.req[l+1])return {gold,lock:`「${UPG_BY.build.steps[u.req[l+1]]}」 필요`};
  const m=u.mats&&u.mats[l+1];return {gold,mat:m?regMats()[m[0]]:null,n:m?m[1]:0};
}

let PT=null;
function promoReq(a){const p=PROMO[a.rar];if(!p)return {ready:false};const pw=power(a),g=Math.round(p.gold*REG().price);
  const checks=[{l:'레벨',cur:a.lvl,need:p.lvl},{l:'원정 성공',cur:a.wins||0,need:p.wins},{l:'전투력',cur:Math.floor(pw),need:p.pow}].map(c=>Object.assign(c,{ok:c.cur>=c.need}));
  const cost=[{l:'골드',k:'gold',cur:S.gold,need:g}].concat(p.stones.map(([k,c])=>({l:STONES[k].name,k,cur:S.stones[k]||0,need:c}))).map(c=>Object.assign(c,{ok:c.cur>=c.need}));
  return {p,checks,cost,gold:g,ready:checks.every(c=>c.ok)&&cost.every(c=>c.ok)};}
function openPromo(id){const a=advById(id);if(!a||a.rar>=4)return;PT={phase:'info',id};renderPromo();}
let ovClosedAt=0;
function closePromo(){PT=null;renderPromo();panelDirty=true;ovClosedAt=performance.now();}
function startPromo(){const a=advById(PT.id);if(!a)return closePromo();const R=promoReq(a);if(!R.ready)return;
  S.gold-=R.gold;R.p.stones.forEach(([k,c])=>S.stones[k]-=c);
  const T=R.p.test;PT=Object.assign(PT,{phase:'ready',test:T,t:0,cd:3,score:0,miss:0,paid:R});
  if(T==='scarecrow')Object.assign(PT,{dur:15,need:12,cells:Array(9).fill(0),spawn:.5});
  if(T==='shield')Object.assign(PT,{total:16,need:12,done:0,atk:null,gap:.6});
  if(T==='rune')Object.assign(PT,{rounds:[3,4,5,6],round:0,seq:[],inp:0,lives:2,show:0,mode:'show'});
  if(T==='duel')Object.assign(PT,{total:8,need:6,done:0,hearts:3,p:0,dir:1,z:.5,zd:1,last:''});
  renderPromo();}
function promoFinish(ok){const a=advById(PT.id);PT.phase='result';PT.ok=ok;
  if(a){if(ok){a.rar++;discover('adv',a.cls+a.rar,`${RARITY[a.rar].name} ${CLASSES[a.cls].name}`);bumpAff(a,15);addLog(`${josa(a.name,'이','가')} ${RARITY[a.rar].name}으로 승급했어요!`);}
    else{const back=PT.paid.p.stones.map(([k,c])=>[k,Math.ceil(c/2)]);back.forEach(([k,c])=>S.stones[k]+=c);PT.back=back;addLog(`${a.name}의 승급 시험이 실패했어요.`);}}
  renderPromo();panelDirty=true;save();}
function rune4(){return Math.floor(Math.random()*4);}
function updatePromo(dt){if(!PT||PT.phase==='info'||PT.phase==='result')return;
  if(PT.phase==='ready'){PT.cd-=dt;if(PT.cd<=0){PT.phase='play';PT.t=0;if(PT.test==='rune')runeNext();renderPromo();}else promoDyn();return;}
  PT.t+=dt;const T=PT.test;
  if(T==='scarecrow'){PT.spawn-=dt;PT.cells=PT.cells.map(v=>v>0?Math.max(0,v-dt):v<0?Math.min(0,v+dt):0);
    if(PT.spawn<=0){PT.spawn=Math.max(.42,.8-PT.t*.025);const free=PT.cells.map((v,i)=>v<=0?i:-1).filter(i=>i>=0);if(free.length)PT.cells[pick(free)]=1.05-Math.min(.35,PT.t*.02);}
    if(PT.t>=PT.dur)return promoFinish(PT.score>=PT.need);if(PT.score>=PT.need&&PT.t>3)return promoFinish(true);}
  if(T==='shield'){if(!PT.atk){PT.gap-=dt;if(PT.gap<=0){if(PT.done>=PT.total)return promoFinish(PT.score>=PT.need);PT.atk={side:Math.random()<.5?'L':'R',p:0,sp:1/(1.25-Math.min(.45,PT.done*.03))};}}
    else{PT.atk.p+=PT.atk.sp*dt;if(PT.atk.p>=1){PT.miss++;PT.done++;PT.flash='miss';PT.atk=null;PT.gap=.35;if(PT.total-PT.done+PT.score<PT.need)return promoFinish(false);}}}
  if(T==='rune'&&PT.mode==='show'){PT.show+=dt;if(PT.show>PT.seq.length*.62+.4){PT.mode='input';PT.inp=0;renderPromo();}}
  if(T==='duel'){PT.p+=PT.dir*(1.1+PT.done*.12)*dt;if(PT.p>1){PT.p=1;PT.dir=-1;}if(PT.p<0){PT.p=0;PT.dir=1;}PT.z+=PT.zd*(.25+PT.done*.05)*dt;if(PT.z>.85){PT.z=.85;PT.zd=-1;}if(PT.z<.15){PT.z=.15;PT.zd=1;}}
  promoDyn();}
function runeNext(){const L=PT.rounds[PT.round];PT.seq=[];for(let i=0;i<L;i++)PT.seq.push(rune4());PT.mode='show';PT.show=0;PT.inp=0;renderPromo();}
function promoTap(kind,arg){if(!PT||PT.phase!=='play')return;const T=PT.test;
  if(T==='scarecrow'&&kind==='cell'){const i=+arg;if(PT.cells[i]>0){PT.cells[i]=-.25;PT.score++;PT.hit=i;}else{PT.t+=1;PT.flash='miss';}promoDyn();}
  if(T==='shield'&&kind==='side'){const A=PT.atk;if(!A)return;if(A.side===arg&&A.p>=.68){PT.score++;PT.flash='ok';}else{PT.miss++;PT.flash='miss';}PT.done++;PT.atk=null;PT.gap=.3;
    if(PT.total-PT.done+PT.score<PT.need)return promoFinish(false);if(PT.score>=PT.need&&PT.done>=PT.total)return promoFinish(true);promoDyn();}
  if(T==='rune'&&kind==='rune'&&PT.mode==='input'){const v=+arg;PT.lastRune=v;PT.lastT=performance.now();
    if(v===PT.seq[PT.inp]){PT.inp++;if(PT.inp>=PT.seq.length){PT.round++;PT.score++;if(PT.round>=PT.rounds.length)return promoFinish(true);PT.mode='wait';setTimeout(()=>{if(PT&&PT.test==='rune')runeNext();},600);}}
    else{PT.lives--;PT.flash='miss';if(PT.lives<=0)return promoFinish(false);PT.mode='wait';setTimeout(()=>{if(PT&&PT.test==='rune'){PT.mode='show';PT.show=0;PT.inp=0;renderPromo();}},700);}
    renderPromo();}
  if(T==='duel'&&kind==='strike'){const ok=Math.abs(PT.p-PT.z)<=.085;PT.done++;if(ok){PT.score++;PT.last='ok';}else{PT.hearts--;PT.last='miss';}
    if(PT.hearts<=0)return promoFinish(false);if(PT.score>=PT.need)return promoFinish(true);if(PT.done>=PT.total)return promoFinish(PT.score>=PT.need);renderPromo();}
}

function upgCard(u){

    <p>지금 <em>${u.steps[l]}</em>${c?` · 다음 <span class="next">${u.steps[l+1]}</span>`:''}</p>
    <p>${u.eff(l)}${c?` → <span class="next">${u.eff(l+1).split(' · ')[0].replace(/^.*?(\S+)$/,'$1')}</span>`:''}</p>
    ${STREAM[u.key]?`<p>${STREAM_NAME[STREAM[u.key][0]]} 보너스 ×${MS_MULT}까지 <em>${MS_EVERY-streamSum(STREAM[u.key][0])%MS_EVERY}단계</em> (${STREAM[u.key][0]==='room'?'침대·벽·소품':STREAM[u.key][0]==='meal'?'주방·가구·바':'조명·외관'} 합산)</p>`:''}
    ${capOf(u)<u.max?`<p>이 지역 한도 <em>${capOf(u)}단계</em> · 더 좋은 곳으로 이사하면 ${u.max}단계까지</p>`:''}
    <div class="pips">${pips}</div></div>
    <button class="btn" data-act="up:${u.key}" ${canPay(c)?'':'disabled'}>${c?'업그레이드':'완료'}<small>${costLabel(c)}</small></button></div>`;
}

  if(tab==='inn'){
    const reqN=S.advs.filter(a=>a.req&&visible(a)).length;
    h+=`<p class="hint">${reqN?`<b class="next">손님 ${reqN}명이 부르고 있어요.</b> 그림 속 말풍선을 눌러 주세요. `:''}증축으로 방을 늘리고, 업그레이드 한 단계마다 소품이 하나씩 늘어나요.${S.lv.staff?` 종업원이 요청의 ${Math.round(STAFF_AUTO[S.lv.staff]*100)}%를 대신 응대해요.`:''}</p>`;
    const IU=UPG.filter(u=>!u.tab),total=IU.reduce((s,u)=>s+Math.min(S.lv[u.key],capOf(u))-(u.min||0),0),totalMax=IU.reduce((s,u)=>s+(capOf(u)-(u.min||0)),0);
    h+=`<div class="sec">여관 완성도<span>${total}/${totalMax}단계</span></div><div class="progress"><i style="width:${total/totalMax*100}%"></i></div>`;
    CATS.forEach(cat=>{const us=UPG.filter(u=>u.cat===cat&&!u.tab);if(!us.length)return;h+=`<div class="sec">${cat}</div>`;us.forEach(u=>{h+=upgCard(u);});});
    h+=`<p class="hint">주방·바 업그레이드는 주방 탭, 모루·화로는 대장간 탭에 있어요.</p>`;
  }else if(tab==='advs'){
    h+=`<div class="chips"><button data-act="view:list" aria-pressed="${advView==='list'}">손님</button><button data-act="view:codex" aria-pressed="${advView==='codex'}">도감</button><button data-act="view:memorial" aria-pressed="${advView==='memorial'}">추모관${(S.memorial||[]).length?' '+S.memorial.length:''}</button></div>`;
    if(advView==='memorial'){
      const M=S.memorial||[];
      h+=`<p class="hint">던전에서 돌아오지 못한 평생 단골의 이야기가 책으로 남는 곳이에요. 책을 펼치면 그 단골과 함께한 날들을 처음부터 다시 읽을 수 있어요.</p>`;
      if(!M.length)h+=`<div class="tomb"><div class="info"><h3>아직 비어 있어요</h3><p>모두 무사히 돌아오고 있어요. 이대로였으면 좋겠네요.</p></div></div>`;
      M.forEach((r,i)=>{h+=`<div class="tomb"><img src="${urlOf(charSprite(r.cls,0,r.tiers[0],r.tiers[1]).r)}" alt=""><div class="info"><h3>${escapeHtml(r.name)} <small style="color:#b9aec4;font-size:12px">${RARITY[r.rar].name} ${CLASSES[r.cls].name}</small></h3>
        <p>${r.since.day}일차 ~ ${r.died.day}일차 · ${REGIONS[r.died.region].short} ${escapeHtml(r.died.floor)}${r.sample?' · <b style="color:#ffd58a">예시 기록</b>':''}</p><p class="cand">${r.candles?'🕯 '+r.candles:''}</p></div>
        <button class="btn" data-act="book:${i}">책 펼치기</button></div>`;});
      if(S.fallen)h+=`<p class="hint">지금까지 돌아오지 못한 모험가 ${S.fallen}명</p>`;
    }else if(advView==='list'){
      if(!S.advs.length)h+=`<p class="hint">아직 손님이 없어요. 곧 첫 모험가가 도착해요.</p>`;
      else h+=`<p class="hint">호감도가 20씩 오를 때마다 단골의 이야기가 하나씩 열려요. 다섯 번째 이야기를 들으면 평생 단골이 돼요. 던전에 다녀올 때마다 전투력이 조금씩 올라요. 실패하면 드물게 돌아오지 못할 수도 있어요.</p>`;
      S.advs.forEach(a=>{
        const rr=RARITY[a.rar];const timed=['eating','sleeping','exploring'].includes(a.state);const tr=advLookTiers(a);
        const nextThr=a.ch<5?THR[a.ch]:null;
        let st='';for(let i=0;i<5;i++)st+=`<button data-act="reread:${a.id}:${i}" ${i<a.ch?'':'disabled'}>${i<a.ch?i+1+'장':'🔒'}</button>`;
        h+=`<div class="card ${a.story?'hot':''}"><img class="sprite" src="${urlOf(charSprite(a.cls,0,tr[0],tr[1]).r)}" alt=""><div class="info">
          <h3>${escapeHtml(a.name)}<small>${CLASSES[a.cls].name} · Lv.${a.lvl}</small><span class="badge" style="background:${rr.color};color:#2a1a10">${rr.name}</span>${a.bond?`<span class="badge" style="background:var(--love);color:#3a1020">평생 단골</span>`:a.visits>=5?`<span class="badge" style="background:#5d8a4e;color:#fff">단골</span>`:''}</h3>
          <p>${hearts(a)} 호감도 ${a.aff}${nextThr?` · 다음 이야기 ${nextThr}`:''} · 전투력 <em>${power(a).toFixed(1)}</em>${a.train?` <small style="color:var(--muted)">(단련 +${a.train.toFixed(1)})</small>`:''}</p>
          <p>특기: <em>${CLASSES[a.cls].perk}</em> · 사연: <em>${a.ch>0?ARCH[a.arch].name:'아직 몰라요'}</em></p>
          <div class="story">${st}</div>
          <p>${gearLine(a)}</p>
          <p>${statusText(a)} · 방문 ${a.visits}회</p>
          <div class="bar" ${timed?'':'style="visibility:hidden"'}><i data-prog="${a.id}"></i></div></div>
          <div class="row">${a.story?`<button class="btn sm love" data-act="story:${a.id}">새 이야기 듣기</button>`:''}<button class="btn sm ghost" data-act="drill:${a.id}" ${S.gold>=drillCost(a)?'':'disabled'}>훈련 +${drillGain()} <small>${fmt(drillCost(a))}G</small></button>${a.rar<4?`<button class="btn sm ${promoReq(a).ready?'':'ghost'}" data-act="promo:${a.id}">${promoReq(a).ready?'승급 시험!':'승급'} <small>→ ${RARITY[a.rar+1].name}</small></button>`:''}</div></div>`;

      const empty=capacity()-S.advs.length;
      if(empty>0&&S.advs.length)h+=`<p class="hint">빈 객실 ${empty}개 · 다음 손님까지 <span data-arrive>${Math.ceil(S.arriveT)}</span>초</p>`;
      if(empty<=0&&capacity()<6)h+=`<p class="hint">객실이 꽉 찼어요. 여관 탭에서 증축하면 손님이 더 와요.</p>`;
      if(S.bondQ&&S.bondQ.length)h+=`<p class="hint">방이 나면 찾아올 평생 단골: ${S.bondQ.map(b=>escapeHtml(b.name)).join(', ')}</p>`;
      if(S.log.length)h+=`<div class="sec">여관 소식</div><div class="logbox">${S.log.map(l=>`<div>${escapeHtml(l)}</div>`).join('')}</div>`;
    }else{
      const tot=CODEX_CATS.reduce((s,c)=>s+c.total,0),got=CODEX_CATS.reduce((s,c)=>s+Math.min(c.total,Object.keys(S.codex[c.key]).length),0);
      h+=`<div class="sec">전체 도감<span>${got}/${tot} · 분야를 완성할 때마다 명성 +10</span></div><div class="progress"><i style="width:${got/tot*100}%"></i></div>`;
      CODEX_CATS.forEach(c=>{const n=Math.min(c.total,Object.keys(S.codex[c.key]).length);
        h+=`<div class="sec">${c.name}${S.codexDone[c.key]?' ✓':''}<span>${n}/${c.total}</span></div>`;
        if(c.key==='story'){
          ARCH.forEach((ar,ai)=>{let dots='';for(let i=0;i<5;i++){const ok=S.codex.story[ai+'-'+i];dots+=`<i class="${ok?'on':''}"></i>`;}
            const any=[0,1,2,3,4].some(i=>S.codex.story[ai+'-'+i]);
            h+=`<div class="card"><div class="info"><h3>${any?ar.name:'???'}</h3><p>${any?ar.ch.map((x,i)=>S.codex.story[ai+'-'+i]?`「${x[0]}」`:'「???」').join(' '):'이런 사연을 가진 단골을 만나면 열려요'}</p><div class="pips">${dots}</div></div></div>`;});
        }else h+=`<div class="grid">${codexTiles(c.key)}</div>`;
      });
    }
  }else if(tab==='dungeon'){
    const rg=REG(),dist=rg.ranks.map((w,i)=>w>0?`${RARITY[i].name} ${Math.round(w*100)}%`:'').filter(Boolean).join(' · ');
    h+=`<div class="card"><div class="info"><h3>${rg.name}<small>지역 ${S.region+1}/${REGIONS.length}</small></h3><p>찾아오는 모험가: ${dist}<br>물가 ×${rg.price} · 던전 난이도 ×${rg.diff} · 명성 보너스 <em class="up">모든 수입 +${Math.round(fameBonus()*100)}%</em></p></div></div>`;
    if(BT||BP){h+=bossPanel();}else{
    const NF=FLOORS.length,dp=deepest();
    h+=`<div class="sec">탐험 목표<span>${dp+1}/${NF}층 개방</span></div><div class="chips"><button data-act="target:auto" aria-pressed="${S.target==='auto'}">자동</button>

    h+=`<div class="sec">층 정보<span>층마다 5번 성공하면 다음 층이 열려요</span></div>`;
    const fcard=(f,i)=>{const open=unlocked(i);const prog=i<NF-1?`다음 층까지 ${Math.min(S.clears[i],5)}/5`:`보스까지 ${Math.min(S.clears[i],5)}/5`;
      const finds=Object.keys(LOOT).filter(k=>LOOT[k].reg===S.region&&LOOT[k].floor===f.band).map(k=>LOOT[k].name).join(', ');const seen=S.codex.mon[f.mon];
      return `<div class="card ${open?'':'locked'}">${seen?img(monIcon(f.mon)):''}<div class="info"><h3>${f.name}</h3>
        <p>${open?`권장 전투력 <em>${f.diff}</em> · ${fmt(f.gold)}G + ${MATS[f.mat].name} · ${f.time}초<br>가끔 발견: ${finds}<br>성공 ${S.clears[i]}회 · ${prog}`:`이전 층에서 5번 성공하면 열려요 · 권장 전투력 ${f.diff}`}</p></div></div>`;};
    if(dp<NF-1)h+=fcard(FLOORS[dp+1],dp+1);
    for(let i=dp;i>=Math.max(0,dp-2);i--)h+=fcard(FLOORS[i],i);
    if(dp>=3){h+=`<div class="logbox">`;for(let i=dp-3;i>=0;i--){const f=FLOORS[i];h+=`<div>${f.name} · 권장 ${f.diff} · 성공 ${S.clears[i]}회</div>`;}h+=`</div>`;}
    const sum=S.advs.reduce((s,a)=>s+power(a),0);
    h+=`<div class="sec">던전의 주인</div><div class="card ${bossOpen()?'':'locked'}">${bossOpen()?img(monIcon(BOSS.key)):''}<div class="info"><h3>${BOSS.name}</h3>
      <p>${S.bossBeaten?'쓰러뜨렸어요. 전리품이 식당 벽에 걸려 있어요.':bossOpen()?`권장 토벌대 전투력 <em>${fmt(BOSS.rec)}</em> · 체력 ${fmt(BOSS.hp)} · 공격력 ${fmt(BOSS.atk)} · 방어력 ${fmt(BOSS.def)}<br>최대 ${BMAX}명을 골라 보내요 · 승리 시 ${fmt(BOSS.gold)}G`:`${FLOORS.length}층에서 5번 성공하면 나타나요`}</p></div>
      ${bossOpen()&&!S.bossBeaten?`<button class="btn" data-act="bossprep">보스방 들어가기<small data-bosscd>${S.bossCd>0?Math.ceil(S.bossCd)+'초 뒤 도전':'정보 보기 · 토벌대 편성'}</small></button>`:''}</div>`;}
    if(S.region<REGIONS.length-1){const nx=REGIONS[S.region+1],bc=S.advs.filter(a=>a.bond).length+(S.bondQ||[]).length;
      h+=`<div class="sec">이사</div><div class="card ${S.bossBeaten?'hot':'locked'}"><div class="info"><h3>${nx.name}(으)로</h3>
        <p>${S.bossBeaten?'':'이 던전의 주인을 쓰러뜨리면 이사할 수 있어요.<br>'}새로 짓지만 「${UPG_BY.build.steps[nx.start.build||0]}」부터 시작하고, ${RARITY[nx.minRank].name} 이상 모험가가 찾아와요. 물가는 지금의 ×${nx.price/REG().price}배라 업그레이드 비용도 그만큼 비싸요.<br>가져가는 것: 골드 ${fmt(S.gold)}G, 재료, 창고 물건, 보관 장비, 명성, 도감, 평생 단골 ${bc}명<br>새로 짓는 것: 건물과 업그레이드</p></div>
        ${S.bossBeaten?`<button class="btn love" data-act="move">이사하기</button>`:''}</div>`;}
  }else if(tab==='kitchen'){
    h+=kitchenPanel();
  }else if(tab==='kitchen_old'){
    h+=`<p class="hint">고른 메뉴가 식탁에 올라가요. 손님이 먹을 때마다 재료를 하나씩 쓰고, 떨어지면 수프로 바뀌어요. 지금 식사비 <em>${mealPrice(0)}G</em> + 요리 추가금.</p>`;
    const kcard=r=>{const open=S.lv.kitchen>=r.kitchen,sel=S.menu===r.id,have=r.need.every(k=>S.mats[k]>0);
      return `<div class="card ${open?'':'locked'} ${sel?'sel':''}">${img(dishIcon(r.id))}<div class="info"><h3>${r.name}${r.need.length?`<small>한 그릇에 ${r.need.map(k=>`${MATS[k].short} 1<span class="${S.mats[k]>0?'':'down'}">(${S.mats[k]})</span>`).join(' + ')}</small>`:''}</h3>
        <p>${open?recipeDesc(r)+(open&&!have?' · <em class="down">재료 부족</em>':''):`주방 설비 ${r.kitchen}단계에서 해금`}</p></div>
        ${open?`<button class="btn ${sel?'ghost':''}" data-act="menu:${r.id}" ${sel?'disabled':''}>${sel?'판매 중':'선택'}</button>`:''}</div>`;};
    h+=kcard(RECIPES[0]);
    for(let rg=S.region;rg>=0;rg--){const rs=RECIPES.filter(r=>r.reg===rg);h+=`<div class="sec">${REGIONS[rg].short} 요리${rg<S.region?'<span>예전 지역 요리 · 추가금은 그곳 물가 기준</span>':'<span>이 지역 재료로 만들어요</span>'}</div>`;rs.forEach(r=>h+=kcard(r));}
    h+=upgCard(UPG_BY.kitchen)+upgCard(UPG_BY.dining)+upgCard(UPG_BY.bar);
  }else if(tab==='forge'){
    h+=forgePanel();
  }else if(tab==='bag'){
    h+=`<div class="card"><div class="info"><div class="wallet"><span class="coin"></span>${fmt(S.gold)}G</div><p>초당 수입 <em class="up">${$('rate').textContent.replace('+','')}</em> · 명성 보너스 <em>+${Math.round(fameBonus()*100)}%</em> · ${REG().name} 물가 ×${REG().price}</p></div></div>`;
    h+=`<div class="sec">승급석<span>모험가 승급 시험에 써요</span></div><div class="grid">${STONE_KEYS.map(k=>`<div class="tile ${S.stones[k]?'':'unk'}"><img src="${urlOf(stoneIcon(k))}" alt=""><b>${STONES[k].name}</b><span class="cnt">${S.stones[k]||0}개</span></div>`).join('')}</div>`;
    h+=`<div class="sec">재료<span>요리·제작에 써요 · 시세는 오늘 기준</span></div><div class="grid">`;
    MAT_KEYS.filter(k=>MATS[k].reg===S.region||S.mats[k]>0).sort((a,b)=>MATS[b].reg-MATS[a].reg).forEach(k=>{h+=`<div class="tile ${S.mats[k]?'':'unk'}"><img src="${urlOf(matIcon(k))}" alt=""><b>${MATS[k].name}</b><span class="cnt">${S.mats[k]}개</span><span>${REGIONS[MATS[k].reg].short}${MATS[k].food?' · 요리':''} · 개당 ${fmt(price(k))}G</span></div>`;});
    h+=`</div>`;
    const owned=Object.keys(LOOT).filter(k=>(S.stock[k]||0)>0);
    h+=`<div class="sec">전리품<span>시장에서 팔 수 있어요</span></div>`;
    if(!owned.length)h+=`<p class="hint">모험가에게 매입한 전리품이 여기 들어와요.</p>`;
    else{h+=`<div class="grid">`;owned.forEach(k=>{h+=`<div class="tile"><img src="${urlOf(lootIcon(k))}" alt=""><b>${LOOT[k].name}</b><span class="cnt">${S.stock[k]}개</span><span>개당 ${fmt(price(k))}G</span></div>`;});h+=`</div>`;}
    h+=`<div class="sec">장비<span>대장간에서 모험가에게 줄 수 있어요</span></div>`;
    if(!S.inv.length)h+=`<p class="hint">대장간에서 만든 장비가 여기 보관돼요.</p>`;
    else{h+=`<div class="grid">`;S.inv.forEach(it=>{h+=`<div class="tile" style="border-color:${GRADES[it.grade].color}"><img src="${urlOf(itemIcon(it.slot,it.cls,it.tier))}" alt=""><b>${itemName(it)}</b><span>전투력 +${it.power}</span></div>`;});h+=`</div>`;}
    h+=`<div class="row"><button class="btn sm" data-act="goto:market">시장에서 사고팔기</button><button class="btn sm ghost" data-act="goto:forge">대장간 가기</button></div>`;
  }else{
    const left=DAY_LEN-S.dayT,mk=MKT[S.region||0];
    const rq=S.offers.filter(o=>advById(o.advId));
    h+=`<div class="mkh"><div><div class="mkn">${mk.name}</div><div class="mkd">${mk.desc}</div></div><div class="mkt"><span>${S.day}일차 시세</span><b data-dayleft>${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</b><span>뒤 바뀜</span></div></div>`;
    h+=`<div class="seg" style="grid-template-columns:repeat(3,1fr)"><button data-act="mv:offer" aria-pressed="${mView==='offer'}">매입 제안${rq.length?`<span class="n">${rq.length}</span>`:''}</button><button data-act="mv:stock" aria-pressed="${mView==='stock'}">창고 팔기</button><button data-act="mv:mats" aria-pressed="${mView==='mats'}">재료 사고팔기</button></div>`;
    const row=(k,n,canBuy)=>{const m=S.prices[k],hs=S.hist[k]||[m],prev=hs.length>1?hs[hs.length-2]:m;const ch=Math.round((m-prev)*100);const p=price(k),base=refBase(k);

      const pct=Math.round((m-1)*100);
      return `<div class="mr"><div class="ifr sm" style="--glow:${MATS[k]?MATS[k].color:'#8a6a3a'}"><img src="${urlOf(keyIcon(k))}" alt=""></div>
        <div class="mi"><b>${nameOf(k)}</b><span>보유 <em>${n}</em>개 · 기준 ${fmt(base)}G</span></div>
        <div class="mspark">${bars}</div>
        <div class="mp"><b>${fmt(p)}G</b><span class="${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct}% ${ch>0?'▲':ch<0?'▼':'–'}</span></div>
        <div class="mbtns"><button class="btn sm" data-act="sell:${k}:1" ${n>0?'':'disabled'}>1개 팔기</button>${n>1?`<button class="btn sm alt" data-act="sell:${k}:all">전부 ${fmt(p*n)}G</button>`:''}${canBuy?`<button class="btn sm ghost" data-act="mbuy:${k}" ${S.gold>=buyPrice(k)?'':'disabled'}>사기 ${fmt(buyPrice(k))}G</button>`:''}</div></div>`;};
    if(S.rare&&S.rare.day===S.day&&mView==='offer'){const R=S.rare,st=STONES[R.k];
      h+=`<div class="of" style="border-color:${st.col};background:linear-gradient(#2e2436,#1e1626)"><div class="of-h"><div class="ifr sm" style="--glow:${st.col}"><img src="${urlOf(stoneIcon(R.k))}" alt=""></div><div class="mi"><b style="color:${st.hi}">희귀 상품 · ${st.name}</b><span>오늘 하루만 · 한 개뿐 · 승급 시험에 써요</span></div><div class="mp"><span>가격</span><b>${fmt(R.price)}G</b></div></div>

  ar.ch.forEach(([t,x],i)=>pg.push(`<h4>제${i+1}장</h4><h2>${t}</h2><p>${escapeHtml(storyText(x,a))}</p>`));
  pg.push(`<h4>기록</h4><h2>함께한 날들</h2><table>

    <tr><td>무사히 돌아온 원정</td><td>${r.wins}번</td></tr><tr><td>마지막 전투력</td><td>${r.pow}</td></tr>
    <tr><td>원정으로 단련한 힘</td><td>+${(+r.train).toFixed(1)}</td></tr><tr><td>호감도</td><td>${r.aff}</td></tr>
    <tr><td>함께한 날</td><td>${r.died.day-r.since.day+1}일</td></tr></table>${r.gear.length?`<p style="margin-top:12px">마지막으로 지녔던 것: ${r.gear.map(escapeHtml).join(', ')}</p>`:''}`);

  pg.push(`<h4>묘비명</h4><div class="orn">✦</div><p class="epi">「${escapeHtml(ep.stone)}」</p><p style="text-align:center">— ${escapeHtml(r.name)}, ${r.since.day}일차 ~ ${r.died.day}일차 —</p><div class="orn">🕯 ${r.candles||0}</div>
    <p style="text-align:center"><button class="btn" id="bkCandle">촛불 켜기</button></p>`);
  return pg;
}
function openBook(i){const r=(S.memorial||[])[i];if(!r)return;BK={i,p:0,pages:bookPages(r)};$('book').hidden=false;drawBook();}
function drawBook(){
  if(!BK)return;$('bkPage').innerHTML=BK.pages[BK.p];$('bkPage').scrollTop=0;
  $('bkNum').textContent=`${BK.p+1} / ${BK.pages.length}`;$('bkPrev').disabled=BK.p===0;$('bkNext').disabled=BK.p===BK.pages.length-1;
  const c=$('bkCandle');if(c)c.onclick=()=>{const r=S.memorial[BK.i];r.candles=(r.candles||0)+1;BK.pages=bookPages(r);drawBook();panelDirty=true;save();};
}
$('bkPrev').addEventListener('click',()=>{if(BK&&BK.p>0){BK.p--;drawBook();}});
$('bkNext').addEventListener('click',()=>{if(BK&&BK.p<BK.pages.length-1){BK.p++;drawBook();}});
$('bkClose').addEventListener('click',()=>{$('book').hidden=true;BK=null;ovClosedAt=performance.now();});
$('book').addEventListener('click',e=>{if(e.target.id==='book'){$('book').hidden=true;BK=null;}});
function showModal(title,body,btns,imgUrl){
  $('mTitle').textContent=title;$('mBody').textContent=body;const box=$('mBtns');box.innerHTML='';
  const mi=$('mImg');if(imgUrl){mi.src=imgUrl;mi.hidden=false;}else mi.hidden=true;
  btns.forEach(b=>{const el=document.createElement('button');el.className='btn'+(b.primary?'':' ghost');el.innerHTML=b.label;
    el.addEventListener('click',()=>{$('modal').hidden=true;ovClosedAt=performance.now();b.fn&&b.fn();tickUI();});box.appendChild(el);});
  $('modal').hidden=false;
}

/* ================= save / load ================= */
function incomeRate(){const win=120;income=income.filter(i=>clock-i.t<=win);const span=Math.min(win,Math.max(20,clock));return income.reduce((s,i)=>s+i.amt,0)/span;}
function serialize(){
  const rate=incomeRate();if(rate>0)S.lastRate=rate;S.lastSave=Date.now();
  return JSON.stringify({...S,ver:6,advs:S.advs.map(serAdv)});
}
let saveBlocked=false;const BAK_KEY=SAVE_KEY+'-bak',BROKEN_KEY=SAVE_KEY+'-broken';
function save(){if(saveBlocked)return;try{localStorage.setItem(SAVE_KEY,serialize());}catch(e){}}
function backupNow(){if(saveBlocked)return;try{localStorage.setItem(BAK_KEY,serialize());}catch(e){}}
function encSave(str){return 'DI1.'+btoa(unescape(encodeURIComponent(str)));}
function decSave(code){code=(code||'').trim();if(code.startsWith('DI1.'))code=decodeURIComponent(escape(atob(code.slice(4).replace(/\s+/g,''))));JSON.parse(code);return code;}
function openSaveMgr(){
  let bak=null;try{bak=localStorage.getItem(BAK_KEY);}catch(e){}
  let bi='';if(bak){try{const d=JSON.parse(bak);bi=`${d.day||1}일차 · ${fmt(Math.floor(d.gold||0))}G · 모험가 ${(d.advs||[]).length}명`;}catch(e){bi='읽을 수 없음';}}
  const o=$('savemgr');o.innerHTML=`<div class="sm-box"><h3>세이브 관리</h3>
   <p>아래 코드를 복사해 두면 다른 기기·브라우저·앱에서 그대로 이어서 할 수 있어요.</p>
   <textarea id="smCode" spellcheck="false" placeholder="여기에 세이브 코드를 붙여넣고 '불러오기'를 누르세요"></textarea>
   <div class="sm-row"><button class="btn" id="smExp">내 세이브 코드 복사</button><button class="btn ghost" id="smImp">불러오기</button></div>
   <div class="sm-bak">${bak?`자동 백업: <b>${bi}</b><button class="btn ghost sm" id="smBak">백업으로 되돌리기</button>`:'자동 백업이 아직 없어요 (하루가 지나면 생겨요)'}</div>
   <div class="sm-msg" id="smMsg"></div><button class="btn ghost" id="smClose">닫기</button></div>`;
  o.hidden=false;const msg=t=>$('smMsg').textContent=t;
  $('smExp').onclick=()=>{save();const code=encSave(serialize());const ta=$('smCode');ta.value=code;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>msg('복사했어요! 메모장 같은 곳에 붙여넣어 보관하세요.'),()=>{try{document.execCommand('copy');msg('복사했어요!');}catch(e){msg('위 코드를 길게 눌러 직접 복사해 주세요.');}});};
  const load=(raw,label)=>{try{const prev=serialize();restore(raw);saveBlocked=false;try{localStorage.setItem(BAK_KEY,prev);}catch(e){}refreshRegion();syncV();bgDirty=true;panelDirty=true;save();o.hidden=true;toast(label);}catch(e){msg('불러오지 못했어요: '+e.message);}};
  $('smImp').onclick=()=>{let raw;try{raw=decSave($('smCode').value);}catch(e){msg('코드가 올바르지 않아요. 전부 복사됐는지 확인해 주세요.');return;}load(raw,'세이브를 불러왔어요!');};
  if(bak)$('smBak').onclick=()=>load(bak,'백업으로 되돌렸어요!');
  $('smClose').onclick=()=>{o.hidden=true;};
}
function restore(raw){
  const d=JSON.parse(raw);const b=fresh();
  S=Object.assign(b,d,{mats:Object.assign(b.mats,d.mats||{}),clears:d.clears||[0,0,0]});S.rushT=0;
  // migrate older saves (v0.4 and before)
  if(!d.lv){const lv=freshLv();lv.rooms=d.rooms||1;
    const g=d.roomGrade||1;lv.bed=Math.min(12,(g-1)*2);lv.walls=Math.min(10,(g-1)*2);
    lv.kitchen=Math.min(12,((d.kitchen||1)-1)*4);lv.sign=Math.min(10,(d.sign||0)*2);lv.bar=Math.min(10,(d.bar||0)*2);
    lv.staff=Math.min(6,Math.max(0,(d.staff||0)*2-1));lv.ext=Math.min(10,(d.ext||0)*2);S.lv=lv;}
  else S.lv=Object.assign(freshLv(0),d.lv);
  if(S.lv.wing>6)S.lv.wing=6;
  if(S.lv['rooms']!=null){S.lv.build={1:0,2:5,3:6,4:9,5:10,6:11}[S.lv['rooms']]||0;delete S.lv['rooms'];}
  if(S.region==null)S.region=0;if(!S.bondQ)S.bondQ=[];if(d.ver==null||d.ver<6)S.introShown=1;
  refreshRegion();
  if(!Array.isArray(S.clears))S.clears=[0,0,0];
  if(S.clears.length!==FLOORS.length){const old=S.clears,N=FLOORS.length,nc=Array(N).fill(0);
    if(old.length===3){for(let i=0;i<N;i++){const bd=bandOf(i,N);if((old[bd]||0)>=5)nc[i]=5;}
      for(let bd=0;bd<3;bd++){if((old[bd]||0)<5){const first=[...Array(N).keys()].find(i=>bandOf(i,N)===bd);if(first!=null&&(bd===0||(old[bd-1]||0)>=5))nc[first]=old[bd]||0;break;}}}
    S.clears=nc;}
  if(S.target!=='auto'&&!(S.target<FLOORS.length))S.target='auto';
  S.memorial=(S.memorial||[]).filter(r=>!r.sample);
  if(!S.codex)S.codex=b.codex;['adv','mon','loot','food','gear','story'].forEach(k=>{if(!S.codex[k])S.codex[k]={};});
  if(!S.codexDone)S.codexDone={};if(!S.cooked)S.cooked={};S.stones=Object.assign({bronze:0,silver:0,gold:0,mithril:0},S.stones||{});Object.keys(S.codex.gear).forEach(k=>{if(k.includes('-')){S.codex.gear[k.split('-')[0]]=1;delete S.codex.gear[k];}});if(S.menu&&!RECIPES.some(r=>r.id===S.menu))S.menu='soup';if(!S.memorial)S.memorial=[];if(!S.fallen)S.fallen=0;
  if(!S.prices||!S.hist){const pr=freshPrices();S.prices=pr.p;S.hist=pr.h;}
  MARKET_KEYS.forEach(k=>{if(S.prices[k]==null)S.prices[k]=1;if(!S.hist[k])S.hist[k]=[S.prices[k]];});
  S.advs=(d.advs||[]).map(o=>{const a=Object.assign(makeAdv(o.cls,o.rar,o.name),o);if(!o.gear)a.gear={weapon:starterWeapon(o.cls),armor:null};
    if(a.aff==null)a.aff=20;if(a.train==null)a.train=0;if(a.trips==null)a.trips=a.visits||0;if(a.wins==null)a.wins=a.visits||0;if(!a.since)a.since={day:Math.max(1,S.day-3),region:S.region};if(!a.regs)a.regs=[S.region];if(a.arch==null)a.arch=Math.floor(Math.random()*ARCH.length);if(a.ch==null)a.ch=0;
    a.state='eating';a.timer=rand(.5,3);a.timerMax=3.5;a.path=[];a.dish=S.menu;a.req=null;a.reqCd=rand(20,40);
    discover('adv',a.cls+a.rar,null);if(a.ch<5&&a.aff>=THR[a.ch])a.story=true;return a;});
  S.advs.forEach(a=>{a.x=seatX(a);a.y=Y[1];});
  const ids=new Set(S.advs.map(a=>a.id));S.offers=(S.offers||[]).filter(o=>ids.has(o.advId));S.repairQ=(S.repairQ||[]).filter(q=>ids.has(q.advId));
}
function grantAway(away){
  if(!(away>30))return;
  const total=S.dayT+away;const days=Math.floor(total/DAY_LEN);for(let i=0;i<Math.min(days,10);i++)newDay(true);S.dayT=total%DAY_LEN;
  const capped=Math.min(away,7200),gain=Math.floor((S.lastRate||0)*capped*.5);
  if(gain>=1){
    const mins=Math.max(1,Math.round(capped/60));
    showModal('자리 비운 동안',`${mins}분 동안 손님들이 ${fmt(gain)}G를 두고 갔어요.`,[
      {label:'받기',fn:()=>{S.gold+=gain;addLog(`자리 비운 동안 ${fmt(gain)}G를 벌었어요.`);save();}},
      {label:'2배 받기<small>광고 자리</small>',primary:true,fn:()=>{S.gold+=gain*2;addLog(`자리 비운 동안 ${fmt(gain*2)}G를 벌었어요.`);save();}}]);
  }
  panelDirty=true;save();
}
function boot(data){
  fitCanvas();
  let raw=null;
  if(data&&data.save)raw=data.save;else{try{raw=localStorage.getItem(SAVE_KEY);}catch(e){}}
  let away=0;
  let bootErr=null;
  if(raw){try{restore(raw);away=(Date.now()-S.lastSave)/1000;try{localStorage.setItem(BAK_KEY,raw);}catch(e){}}catch(e){bootErr=e;
    try{if(!localStorage.getItem(BROKEN_KEY))localStorage.setItem(BROKEN_KEY,raw);}catch(_){}
    let bak=null;try{bak=localStorage.getItem(BAK_KEY);}catch(_){}
    try{if(!bak)throw 0;restore(bak);away=(Date.now()-S.lastSave)/1000;bootErr.recovered=true;}catch(_){S=fresh();saveBlocked=true;}}}
  refreshRegion();syncV();bgDirty=true;if(S.log[0])showTicker();renderPanel();
  if(bootErr){if(bootErr.recovered)showModal('세이브 복구','세이브를 읽다가 문제가 생겨서 가장 최근 자동 백업으로 불러왔어요.\n(오류: '+bootErr.message+')',[{label:'확인',primary:true}]);
    else showModal('세이브를 불러오지 못했어요','기존 세이브는 지우지 않고 보관해 뒀어요. 개발자에게 아래 오류를 알려주세요.\n(오류: '+bootErr.message+')',[{label:'잠시 그대로 두기',primary:true},{label:'새로 시작',fn:()=>{saveBlocked=false;save();}}]);}
  else if(!S.introShown){S.introShown=1;showModal(REG().name,REG().intro,[{label:'여관 문 열기',primary:true}]);}
  if(!data||!data.save)grantAway(away);
  window.claude?.hot?.snapshot?.(()=>({save:serialize()}));
  let last=performance.now(),saveT=0,uiT=0;
  function loop(now){
    const dt=Math.min(.1,(now-last)/1000);last=now;clock+=dt;S.playSec+=dt;
    if(S.rushT>0)S.rushT=Math.max(0,S.rushT-dt);
    if(S.rushCd>0)S.rushCd=Math.max(0,S.rushCd-dt);
    if(S.bossCd>0)S.bossCd=Math.max(0,S.bossCd-dt);
    if(shake>0)shake=Math.max(0,shake-dt);
    S.dayT+=dt;if(S.dayT>=DAY_LEN)newDay();
    S.arriveT-=dt;
    if(S.arriveT<=0){S.arriveT=arrivalInterval();if(S.advs.length<capacity())spawnGuest(S.advs.length===0&&S.totalEarned===0);}
    [...S.advs].forEach(a=>updateAdv(a,dt));
    if(BT)updateBattle(dt);
    if(PT)updatePromo(dt);
    updateWalkers(dt);
    for(let i=S.offers.length-1;i>=0;i--){const o=S.offers[i];o.t-=dt;if(o.t<=0){const a=advById(o.advId);S.offers.splice(i,1);if(a)addLog(`${a.name}이(가) ${LOOT[o.key].name}을(를) 다른 데 팔았어요.`);panelDirty=true;}}
    updateMG(dt);
    if(mgDirty||(!!MG&&scene===mgScene())!==mgShown)renderMGHud();else if(mgShown)updateMGHud();
    for(let i=pending.length-1;i>=0;i--){if(clock>=pending[i].at){const p=pending.splice(i,1)[0];p.fn();}}
    floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.5);
    parts.forEach(p=>p.t+=dt);parts=parts.filter(p=>p.t<p.life);
    if(tickerT>0){tickerT-=dt;if(tickerT<=0)$('ticker').style.opacity=.55;}
    dispGold+=(S.gold-dispGold)*Math.min(1,dt*10);if(Math.abs(S.gold-dispGold)<1)dispGold=S.gold;$('gold').textContent=fmt(dispGold);
    drawFrame(dt);auUpdate();
    uiT+=dt;if(uiT>.2){uiT=0;tickUI();}
    saveT+=dt;if(saveT>5){saveT=0;save();}
    requestAnimationFrame(loop);
  }
  tickUI();requestAnimationFrame(loop);
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();hiddenAt=Date.now();}
  else if(hiddenAt){const away=(Date.now()-hiddenAt)/1000;hiddenAt=0;if(!BT&&!MG&&!(PT&&PT.phase!=='info'))grantAway(away);}
});
/* back button: 종료 확인 */
let exiting=false;
function trapBack(){try{history.pushState({inn:1},'');}catch(e){}}
function askExit(){
  showModal('게임을 종료할까요?','진행 상황은 저장돼요. 자리를 비운 동안에도 손님들이 골드를 두고 가요.',[
    {label:'아니요',primary:true},
    {label:'예',fn:()=>{save();exiting=true;try{window.close();}catch(e){}history.go(-2);
      setTimeout(()=>{if(!document.hidden){exiting=false;trapBack();toast('홈 버튼으로 나가 주세요. 진행은 저장됐어요.');}},500);}}]);
}
const APPMODE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}catch(e){return false;}})();
if(APPMODE)window.addEventListener('popstate',()=>{
  if(exiting)return;trapBack();
  if(!$('modal').hidden){$('modal').hidden=true;ovClosedAt=performance.now();tickUI();return;}
  if(!$('savemgr').hidden){$('savemgr').hidden=true;return;}
  if(!$('book').hidden){$('book').hidden=true;BK=null;return;}
  if(PT){if(PT.phase==='info'||PT.phase==='result'){closePromo();renderPanel();}return;}
  if(BT||MG)return;
  if(tab!=='inn'){setTab('inn');return;}
  askExit();
});
if(APPMODE)trapBack();
window.addEventListener('pagehide',save);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
